apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-classs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitea.server.local/Andherson/storage-classs
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
