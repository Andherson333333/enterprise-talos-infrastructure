apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alloy
  namespace: grafana-alloy
  annotations:
    helm.sh/resource-policy: keep
data:
  config.alloy: |
    // --- Logs: pod logs via Kubernetes API (no hostPath, Talos compatible) ---
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending|Succeeded|Failed|Completed"
        action        = "drop"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      stage.static_labels {
        values = { cluster = "test-cluster" }
      }
      forward_to = [loki.write.default.receiver]
    }

    // --- Logs: Talos system logs via syslog TCP (json_lines, octet framing) ---
    loki.source.syslog "talos_system" {
      listener {
        address               = "0.0.0.0:5140"
        protocol              = "tcp"
        idle_timeout          = "30s"
        label_structured_data = true
        use_rfc5424_message   = true
        labels = {
          job     = "talos-system",
          cluster = "test-cluster",
        }
      }
      forward_to = [loki.process.talos.receiver]
    }

    loki.process "talos" {
      stage.static_labels {
        values = { cluster = "test-cluster" }
      }
      forward_to = [loki.write.default.receiver]
    }

    // --- Logs destination: Loki ---
    loki.write "default" {
      endpoint {
        url = "http://loki.loki-system.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

    // --- OTLP receiver: traces + logs from instrumented apps ---
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        traces = [otelcol.processor.batch.default.input]
        logs   = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      timeout         = "5s"
      send_batch_size = 1000
      output {
        traces = [otelcol.exporter.otlp.tempo.input]
        logs   = [otelcol.exporter.loki.otel.input]
      }
    }

    // --- Traces destination: Tempo ---
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo.tempo-system.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }

    // --- OTel logs destination: Loki via exporter ---
    otelcol.exporter.loki "otel" {
      forward_to = [loki.write.default.receiver]
    }
