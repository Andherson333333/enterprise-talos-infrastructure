apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy-https
  namespace: grafana-alloy
spec:
  parentRefs:
    - name: infra-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - "alloy.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana-alloy
          port: 12345
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy-http-redirect
  namespace: grafana-alloy
spec:
  parentRefs:
    - name: infra-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - "alloy.local"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
