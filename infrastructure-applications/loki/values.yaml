loki:
  # --- Image (Harbor proxy cache) ---
  image:
    registry: registry.harbor.local
    repository: proxy-docker/grafana/loki

  # --- Deployment mode ---
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    nodeSelector:
      workload-type: "infrastructure"
      node.talos.dev/tier: "infrastructure"
    tolerations:
      - key: "workload-type"
        value: "infrastructure"
        effect: "PreferNoSchedule"
        operator: "Equal"
    persistence:
      enabled: true
      storageClass: loki-longhorn
      size: 2Gi
    extraArgs:
      - -config.expand-env=true

  # --- Loki config ---
  loki:
    auth_enabled: false
    commonConfig:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    storage:
      type: filesystem
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 4h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_streams_per_user: 10000
      max_line_size: 256kb
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
      working_directory: /var/loki/compactor
    ingester:
      chunk_idle_period: 30m
      chunk_block_size: 262144
      chunk_retain_period: 1m
      wal:
        enabled: true
        dir: /var/loki/wal
      lifecycler:
        address: 127.0.0.1
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
    ruler:
      ring:
        kvstore:
          store: inmemory
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: warn

  # --- Distributed components (disabled) ---
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  # --- Caches (disabled) ---
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # --- Gateway (disabled, exposed via HTTPRoute) ---
  gateway:
    enabled: false

  # --- Self monitoring and tests (disabled) ---
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
  test:
    enabled: false

  # --- ServiceMonitor (Prometheus scraping) ---
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
