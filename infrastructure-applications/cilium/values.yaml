cilium:
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
        - NET_BIND_SERVICE
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  image:
    repository: registry.harbor.local/proxy-quay/cilium/cilium
    useDigest: false
  certgen:
    image:
      repository: registry.harbor.local/proxy-quay/cilium/certgen
      useDigest: false
  nodeinit:
    image:
      repository: registry.harbor.local/proxy-quay/cilium/startup-script
      useDigest: false
  envoy:
    image:
      repository: registry.harbor.local/proxy-quay/cilium/cilium-envoy
      useDigest: false

  operator:
    replicas: 1
    rollOutPods: true
    image:
      override: "registry.harbor.local/proxy-quay/cilium/operator-generic:v1.20.1"
      useDigest: false

  hubble:
    enabled: true
    tls:
      auto:
        enabled: true
        method: helm
    metrics:
      enabled:
        - dns
        - drop
        - tcp
        - flow
        - port-distribution
        - icmp
        - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
    relay:
      enabled: true
      rollOutPods: true
      image:
        repository: registry.harbor.local/proxy-quay/cilium/hubble-relay
        useDigest: false
    ui:
      enabled: true
      rollOutPods: true
      frontend:
        image:
          repository: registry.harbor.local/proxy-quay/cilium/hubble-ui
          useDigest: false
      backend:
        image:
          repository: registry.harbor.local/proxy-quay/cilium/hubble-ui-backend
          useDigest: false

  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup

  cni:
    binPath: /opt/cni/bin
    confPath: /etc/cni/net.d
    exclusive: false

  kubeProxyReplacement: true
  k8sServiceHost: 192.168.253.100
  k8sServicePort: 6443
  routingMode: native
  autoDirectNodeRoutes: true
  ipv4NativeRoutingCIDR: 10.244.0.0/16
  ipam:
    mode: kubernetes
  ipv4:
    enabled: true
  ipv6:
    enabled: false

  bpf:
    datapathMode: netkit
    hostLegacyRouting: false
    masquerade: true
    preallocateMaps: true

  loadBalancer:
    acceleration: disabled
    mode: hybrid
    algorithm: maglev

  bandwidthManager:
    enabled: true
    bbr: true

  gatewayAPI:
    enabled: true
    installCRDs: true

  bgpControlPlane:
    enabled: true
  externalIPs:
    enabled: true
  k8sClientRateLimit:
    qps: 50
    burst: 200
