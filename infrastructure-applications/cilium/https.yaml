---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-https
  namespace: kube-system
spec:
  parentRefs:
    - name: infra-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - "hubble.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hubble-ui
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-http-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: infra-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - "hubble.local"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
