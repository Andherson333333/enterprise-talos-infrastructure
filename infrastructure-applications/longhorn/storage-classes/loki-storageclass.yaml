apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: loki-longhorn
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  numberOfReplicas: "2"
  fsType: "ext4"
  nodeSelector: "infrastructure"
  dataLocality: "best-effort"
  #recurringJobSelector: '[{"name":"prometheus-monitoring","isGroup":true}]'
