apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infra-gateway
  namespace: gateway-system
  annotations:
    io.cilium/lb-ipam-pool: "infrastructure-pool"
    io.cilium/lb-ipam-ips: "192.168.141.51"
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.local"
      tls:
        mode: Terminate
        certificateRefs:
          - name: infra-tls
            namespace: gateway-system
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.local"
      allowedRoutes:
        namespaces:
          from: All
